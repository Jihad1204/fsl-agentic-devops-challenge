name: CI Pipeline

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main

env:
  NODE_OPTIONS: --openssl-legacy-provider

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codebase/rdicidr-0.1.0
    outputs:
      node-modules-cache-key: ${{ steps.cache-meta.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - id: cache-meta
        run: |
          echo "key=node-modules-${{ github.run_id }}-${{ hashFiles('codebase/rdicidr-0.1.0/package-lock.json') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: codebase/rdicidr-0.1.0/package-lock.json
      - name: Install dependencies
        run: |
          npm config set engine-strict false
          npm install --no-audit --no-fund
          # eslint-plugin-prettier@3 needs Prettier 2 API; stale locks may still pull Prettier 3
          npm install prettier@2.8.8 eslint-config-prettier@8.10.0 eslint-plugin-prettier@3.4.1 --no-save --no-audit --no-fund
      - uses: actions/cache/save@v4
        with:
          path: codebase/rdicidr-0.1.0/node_modules
          key: ${{ steps.cache-meta.outputs.key }}

  lint:
    name: Lint (ESLint)
    needs: install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codebase/rdicidr-0.1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/cache/restore@v4
        with:
          path: codebase/rdicidr-0.1.0/node_modules
          key: ${{ needs.install.outputs.node-modules-cache-key }}
      - run: npm run lint

  test:
    name: Test (Jest)
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codebase/rdicidr-0.1.0
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/cache/restore@v4
        with:
          path: codebase/rdicidr-0.1.0/node_modules
          key: ${{ needs.install.outputs.node-modules-cache-key }}
      - run: CI=true npm run test -- --watchAll=false

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codebase/rdicidr-0.1.0
    env:
      GENERATE_SOURCEMAP: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/cache/restore@v4
        with:
          path: codebase/rdicidr-0.1.0/node_modules
          key: ${{ needs.install.outputs.node-modules-cache-key }}
      - run: npm run build
