name: CI Pipeline

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    outputs:
      node-modules-cache-key: ${{ steps.cache-meta.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - id: cache-meta
        run: |
          echo "key=node-modules-${{ github.run_id }}-${{ hashFiles('package-lock.json') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: "14"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm config set engine-strict false
      - run: npm install
      - uses: actions/cache/save@v4
        with:
          path: node_modules
          key: ${{ steps.cache-meta.outputs.key }}

  lint:
    name: Lint (ESLint)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "14"
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.install.outputs.node-modules-cache-key }}
      - run: npm run lint

  test:
    name: Test (Jest)
    needs: lint
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "14"
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.install.outputs.node-modules-cache-key }}
      - run: CI=true npm run test

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "14"
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.install.outputs.node-modules-cache-key }}
      - run: npm run build
