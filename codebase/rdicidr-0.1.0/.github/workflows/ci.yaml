name: CI Pipeline

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main

env:
  NODE_OPTIONS: --openssl-legacy-provider

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: |
          npm config set engine-strict false
          npm install --no-audit --no-fund
          npm install prettier@2.8.8 eslint-config-prettier@8.10.0 eslint-plugin-prettier@3.4.1 --no-save --no-audit --no-fund
      - uses: actions/cache/save@v4
        with:
          path: node_modules
          key: node-modules-${{ github.run_id }}-${{ hashFiles('package-lock.json') }}

  lint:
    name: Lint (ESLint)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ github.run_id }}-${{ hashFiles('package-lock.json') }}
      - run: npm run lint

  test:
    name: Test (Jest)
    needs: lint
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ github.run_id }}-${{ hashFiles('package-lock.json') }}
      - run: CI=true npm run test -- --watchAll=false

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    env:
      GENERATE_SOURCEMAP: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ github.run_id }}-${{ hashFiles('package-lock.json') }}
      - run: npm run build
